[package]
name = "baal-ml"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
ryu-js = "=1.0.3"
sha2 = "0.10"
num-bigint = "0.4"
indexmap = "2"

[profile.release]
lto = "thin"
codegen-units = 1
