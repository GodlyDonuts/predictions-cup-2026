[package]
name = "baal-portfolio-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std"] }
ryu-js = "=1.0.3"
baal-dual-no-engine = { path = "../dual-no-engine" }

[build-dependencies]
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
