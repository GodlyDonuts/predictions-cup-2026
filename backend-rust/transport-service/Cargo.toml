[package]
name = "baal-transport-service"
version = "0.1.0"
edition = "2024"

[features]
offline-fixtures = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
httpdate = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_Threading"] }

[profile.release]
lto = "thin"
codegen-units = 1
