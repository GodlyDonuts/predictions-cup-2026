[package]
name = "baal-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "preserve_order", "float_roundtrip"] }
sha2 = "0.10"
rayon = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[build-dependencies]
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1

