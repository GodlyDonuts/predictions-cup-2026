[package]
name = "baal-legacy-probability-engine"
version = "0.1.0"
edition = "2024"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
ryu-js = "=1.0.3"
chrono = { version = "0.4", default-features = false, features = ["std"] }
[profile.release]
lto = "thin"
codegen-units = 1
