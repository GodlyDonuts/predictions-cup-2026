name: Isolated engineering source check
on:
  push:
    branches: [engineering/execution-timing-check-20261004]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export tracked source for offline regression tests
        run: git archive --format=tar HEAD > source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: engineering-source
          path: source.tar
          retention-days: 1
          if-no-files-found: error
