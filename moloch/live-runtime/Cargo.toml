[package]
name = "moloch-live-runtime"
version = "0.1.0"
edition = "2024"
[dependencies]
moloch-replay = { path = "../native" }
moloch-relationship-arbitrage = { path = "../relationship-arbitrage" }
baal-transport-service = { path = "../../backend-rust/transport-service" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std"] }
[profile.release]
lto = "thin"
codegen-units = 1

[dev-dependencies]
baal-transport-service = { path = "../../backend-rust/transport-service", features = ["offline-fixtures"] }
